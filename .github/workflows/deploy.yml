name: Deploy mdBook to GitHub Pages

# 触发：推到默认分支时自动发布；也支持在 Actions 页面手动触发
on:
  push:
    branches:
      - main   # 若你的默认分支是 master，改成 master
  workflow_dispatch:

# 授予 GITHUB_TOKEN 所需权限（GitHub Pages 部署要求）
permissions:
  contents: read   # 读取仓库
  pages: write     # 推送 Pages
  id-token: write  # 用于 OIDC 鉴权

# 同一时间只允许一个部署流程，避免并发覆盖
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # 想锁定可复现版本时改成具体号，例如 '0.4.43'
          mdbook-version: 'latest'

      # 本项目只用了 mdBook 内置功能（无 mdbook-mermaid / admonish 等插件），
      # 因此 `mdbook build` 即可，不需要额外安装预处理插件。
      - name: Build mdBook
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # mdBook 默认输出目录就是 book/（与 .gitignore 中的忽略项一致）
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
